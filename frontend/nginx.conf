server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (/dam/..., /traffic/..., etc.) must serve
    # index.html so deep links and page refreshes work with react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}